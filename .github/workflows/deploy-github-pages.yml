name: Deploy GitHub Pages

on:
  push:
    branches:
      - newMaster
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Build
        env:
          # webpack 4 / react-scripts 3 needs the OpenSSL legacy provider on modern Node
          NODE_OPTIONS: --openssl-legacy-provider
          # CRA treats warnings as errors when CI=true; don't fail the deploy on that
          CI: "false"
        run: yarn build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          force_orphan: true
